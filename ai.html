<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI — Loops.szn</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #16121e;
      --mist: #e8e0f0;
      --textdim: rgba(232,224,240,0.4);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Nunito', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--mist);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  animation: fadeInDark 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
    @keyframes fadeInDark {
  0%   { opacity: 0; filter: brightness(0.2); }
  100% { opacity: 1; filter: brightness(1); }
}
    a { color: inherit; text-decoration: none; }

    /* BG */
    #dream-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 15% 15%, rgba(140,80,180,0.16) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 85% 65%, rgba(80,100,180,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 95%, rgba(180,100,140,0.09) 0%, transparent 60%),
        linear-gradient(160deg, #1a1424 0%, #1c1428 50%, #16121e 100%);
    }
    .orb {
      position: fixed;
        inset: auto;
        max-width: 100vw;
        max-height: 100vh;
      filter: blur(80px); animation: orbDrift ease-in-out infinite; will-change: transform, opacity;
      pointer-events: none;
      overflow: hidden;
    }
    @keyframes orbDrift {
      0%   { transform: translate(0,0) scale(1); opacity: var(--oa); }
      33%  { transform: translate(var(--dx1),var(--dy1)) scale(1.08); opacity: calc(var(--oa)*1.3); }
      66%  { transform: translate(var(--dx2),var(--dy2)) scale(0.94); opacity: calc(var(--oa)*0.7); }
      100% { transform: translate(0,0) scale(1); opacity: var(--oa); }
    }
    #grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }
    #vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(14,10,20,0.65) 100%);
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 500;
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(18,14,26,0.75);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .logo { font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(232,224,240,0.7); }
    .logo a { color: inherit; }
    nav { display: flex; }
    nav a {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--textdim); padding: 6px 16px; border: 1px solid transparent; border-radius: 20px;
      transition: color 0.4s, border-color 0.4s, background 0.4s;
    }
    nav a:hover { color: var(--mist); border-color: rgba(255,255,255,0.1); }
    nav a.active { color: var(--mist); border-color: rgba(200,180,240,0.22); background: rgba(160,120,220,0.07); }

    /* PAGE HEADER */
    .page-intro {
      position: relative; z-index: 2;
      padding: 50px 28px 36px;
      opacity: 0; transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .page-intro.visible { opacity: 1; transform: translateY(0); }
    .page-intro h1 {
      font-family: var(--serif); font-size: clamp(44px, 7vw, 88px);
      font-weight: 300; font-style: italic; letter-spacing: -0.02em; line-height: 1;
      color: var(--mist);
    }
    .page-intro p {
      margin-top: 6px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--textdim);
    }

    /* COLLAGE STAGE */
    #stage {
    position: relative; z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    overflow-x: hidden;
    }
@media (max-width: 768px) {
  #stage {
    max-width: none;
    width: 100%;
    margin: 0;
    padding: 0 16px 80px;
  }
}
    @media (max-width: 768px) {
    #grain,
    #vignette,
    .card::after {
        display: none !important;
    }

    .card video {
        filter: none !important;
        -webkit-filter: none !important;
  filter: none !important;
  will-change: auto;
    }
    @media (max-width: 768px) {
  .card::after {
    display: none !important;
    content: none !important;
  }
  #vignette {
    display: none !important;
  }
}
}

    /* CARD */
    .card {
      position: absolute;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      opacity: 0;
      transition: opacity 0.7s ease, box-shadow 0.4s ease;
      cursor: default;
    }
    .card.visible { opacity: 1; }
    .card::after {
      content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(180deg, rgba(18,14,26,0.2) 0%, transparent 25%, transparent 70%, rgba(14,10,22,0.55) 100%);
      transition: opacity 0.5s ease;
    }
    .card:hover::after { opacity: 0.4; }
    .card video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
      filter: saturate(0.65) brightness(0.82) contrast(1.08);
      transition: filter 0.7s ease, transform 0.7s ease;
    }
    .card:hover video {
      filter: saturate(0.85) brightness(0.95) contrast(1.04);
      transform: scale(1.025);
    }
    .card-label {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
      padding: 18px 12px 10px;
      background: linear-gradient(0deg, rgba(14,10,22,0.8) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.45s ease;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .card:hover .card-label { opacity: 1; }
    .card-name {
      font-family: var(--serif); font-size: 14px; font-weight: 400; font-style: italic;
      color: var(--mist); line-height: 1.2;
    }
    .card-tag { font-family: var(--sans); font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--textdim); }

    /* Shimmer placeholder */
    
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .card.loaded .card-shimmer { display: none; }

    /* STATUS BAR */
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 30px;
      background: rgba(14,10,22,0.88);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 20px; padding: 0 20px;
      font-size: 9px; color: var(--textdim); letter-spacing: 0.1em; text-transform: uppercase; z-index: 700; font-weight: 600;
    }
    .sb-dot {
      width: 5px; height: 5px; border-radius: 50%; background: rgba(180,140,220,0.6);
      display: inline-block; margin-right: 6px;
      animation: sbp 3s ease-in-out infinite; box-shadow: 0 0 6px rgba(180,140,220,0.4);
    }
    @keyframes sbp { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* MOBILE */
    @media (max-width: 768px) {
      #stage { height: auto !important; }
      .card {
        position: static !important; width: 100% !important; height: auto !important;
        margin-bottom: 8px; display: block; opacity: 1 !important;
      }
      .card video { position: static; width: 100%; height: auto; aspect-ratio: 16/9; }
      .card-label { opacity: 1; }
      header { padding: 12px 16px; }
      nav a { padding: 5px 10px; font-size: 9px; }
      .page-intro { padding: 30px 16px 24px; }
    }
  </style>
</head>
<body>

<div id="dream-bg"></div>
<div class="orb" style="width:500px;height:500px;top:-80px;left:-80px;background:radial-gradient(circle,rgba(130,70,190,0.2),transparent 70%);--oa:0.8;--dx1:50px;--dy1:40px;--dx2:-20px;--dy2:70px;animation-duration:22s;"></div>
<div class="orb" style="width:380px;height:380px;bottom:5%;right:-60px;background:radial-gradient(circle,rgba(70,90,190,0.16),transparent 70%);--oa:0.6;--dx1:-40px;--dy1:-30px;--dx2:20px;--dy2:-50px;animation-duration:28s;animation-delay:-10s;"></div>
<div class="orb" style="width:320px;height:320px;top:45%;left:38%;background:radial-gradient(circle,rgba(190,90,130,0.1),transparent 70%);--oa:0.5;--dx1:35px;--dy1:50px;--dx2:-15px;--dy2:25px;animation-duration:18s;animation-delay:-6s;"></div>
<div id="grain"></div>
<div id="vignette"></div>

<header>
  <div class="logo"><a href="index.html">Loops.szn</a></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="ai.html" class="active">AI</a>
  </nav>
</header>

<div class="page-intro" id="page-intro">
  <h1>Machine Dreams</h1>
  <p>AI-generated work — loops.szn — 2025-2026</p>
</div>

<div id="stage"></div>

<div id="status-bar">
  <span><span class="sb-dot"></span>AI.HTML</span>
  <span id="sb-count" style="opacity:0.35;">18 works</span>
  <span style="margin-left:auto;" id="status-time"></span>
</div>

<script>
  // ── VIDEO DATA ──
  const videos = [
    { src: 'Content/ai/armandaleg.mp4',          name: 'Armanda Leg' },
    { src: 'Content/ai/bitethebullet.mp4',        name: 'Bite the Bullet' },
    { src: 'Content/ai/bitingthehand.mp4',        name: 'Biting the Hand' },
    { src: 'Content/ai/box.mp4',                  name: 'Box' },
    { src: 'Content/ai/burningbridges.mp4',       name: 'Burning Bridges' },
    { src: 'Content/ai/derstrand.mp4',            name: 'Der Strand' },
    { src: 'Content/ai/elephantintheroom.mp4',    name: 'Elephant in the Room' },
    { src: 'Content/ai/laboratory.mp4',           name: 'Laboratory' },
    { src: 'Content/ai/loops.mp4',                name: 'Loops' },
    { src: 'Content/ai/masked ball.mp4',          name: 'Masked Ball' },
    { src: 'Content/ai/skeletonsinthecloset.mp4', name: 'Skeletons in the Closet' },
    { src: 'Content/ai/soviet.mp4',               name: 'Soviet' },
    { src: 'Content/ai/streets.mp4',              name: 'Streets' },
    { src: 'Content/ai/tolpa.mp4',                name: 'Tolpa' },
    { src: 'Content/ai/valuemeal.mp4',            name: 'Value Meal' },
    { src: 'Content/ai/voina.mp4',                name: 'Voina' },
    { src: 'Content/ai/water tower.mp4',          name: 'Water Tower' },
    { src: 'Content/ai/yeindia.mp4',              name: 'Ye India' },
  ];

  // ── LAYOUT ──
  // Each row is an array of { span, h } where span = fraction of width (must sum to 1), h = height in px
  // This produces zero gaps by design — every row fully fills width
  const GAP = 10;
  const ROWS = [
    // row 1: big cinematic + tall portrait
    [{ span: 0.58, h: 340 }, { span: 0.42, h: 340 }],
    // row 2: square + wide + square
    [{ span: 0.22, h: 260 }, { span: 0.56, h: 260 }, { span: 0.22, h: 260 }],
    // row 3: full panoramic
    [{ span: 1.0,  h: 280 }],
    // row 4: narrow + wide
    [{ span: 0.32, h: 300 }, { span: 0.68, h: 300 }],
    // row 5: three unequal
    [{ span: 0.45, h: 260 }, { span: 0.30, h: 260 }, { span: 0.25, h: 260 }],
    // row 6: wide + narrow
    [{ span: 0.65, h: 320 }, { span: 0.35, h: 320 }],
    // row 7: four tight
    [{ span: 0.28, h: 220 }, { span: 0.24, h: 220 }, { span: 0.26, h: 220 }, { span: 0.22, h: 220 }],
    // row 8: full wide closer
    [{ span: 1.0,  h: 360 }],
  ];

  const isMobile = () => window.innerWidth <= 768;

  function buildLayout() {
    const stage = document.getElementById('stage');
    stage.innerHTML = '';

    if (isMobile()) {
      videos.forEach(v => stage.appendChild(makeCard(v)));
      return;
    }

    const W = stage.clientWidth;
    let videoIdx = 0;
    let y = 0;

    ROWS.forEach(row => {
      let x = 0;
      const rowH = row[0].h;

      row.forEach((cell, ci) => {
        const totalGaps = (row.length - 1) * GAP;
        const cellW = Math.floor((W - totalGaps) * cell.span);
        const cellX = x;

        if (videoIdx < videos.length) {
          const card = makeCard(videos[videoIdx], cellW, rowH);
          card.style.left = cellX + 'px';
          card.style.top  = y + 'px';
          card.style.width  = cellW + 'px';
          card.style.height = rowH + 'px';
          stage.appendChild(card);
          videoIdx++;
        }

        x += cellW + GAP;
      });

      y += rowH + GAP;
    });

    stage.style.height = (y - GAP + 60) + 'px';
  }

  function makeCard(v, w, h) {
    const card = document.createElement('div');
    card.className = 'card';

    const shimmer = document.createElement('div');
    shimmer.className = 'card-shimmer';

    const video = document.createElement('video');
    video.autoplay = true; video.muted = true; video.loop = true; video.playsInline = true;
    const source = document.createElement('source');
    source.dataset.src = v.src;
    video.appendChild(source);

    const label = document.createElement('div');
    label.className = 'card-label';
    label.innerHTML = `<span class="card-name">${v.name}</span><span class="card-tag">2026</span>`;

    card.appendChild(shimmer);
    card.appendChild(video);
    card.appendChild(label);
    return card;
  }

  // ── LAZY LOAD via IntersectionObserver ──
  const stage = document.getElementById('stage');

  const lazyObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const card = e.target;
      const source = card.querySelector('source[data-src]');
      if (source) {
        source.src = source.dataset.src;
        source.removeAttribute('data-src');
        const vid = card.querySelector('video');
        vid.load();
        vid.addEventListener('canplay', () => card.classList.add('loaded'), { once: true });
      }
      card.classList.add('visible');
      lazyObs.unobserve(card);
    });
  }, { threshold: 0.05, rootMargin: '0px 0px 300px 0px' });

  function observeCards() {
    document.querySelectorAll('.card').forEach(c => lazyObs.observe(c));
  }

  // ── INIT ──
  buildLayout();
  observeCards();

  window.addEventListener('resize', () => {
    clearTimeout(window._rt);
    window._rt = setTimeout(() => { buildLayout(); observeCards(); }, 200);
  });

  // Page intro reveal
  setTimeout(() => document.getElementById('page-intro').classList.add('visible'), 80);

  // TIME
  function updateTime() {
    const el = document.getElementById('status-time');
    if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  setInterval(updateTime, 1000); updateTime();

  // PAUSE ORBS WHEN HIDDEN
  document.addEventListener('visibilitychange', () => {
    const s = document.hidden ? 'paused' : 'running';
    document.querySelectorAll('.orb, .sb-dot').forEach(el => el.style.animationPlayState = s);
  });
</script>
</body>
</html>
