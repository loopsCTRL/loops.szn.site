/* ----------------------------
 MARQUEE ANIMATION STYLES
 ----------------------------- */

/* Using the reference header's marquee animation and styles (replaces old header CSS) */
@keyframes marquee-scroll {
  /* Start position: content is off-screen to the right by its own width plus padding */
  0% { transform: translateX(calc(100% + 40px)); }
  /* End position: content moves fully past the left edge */
  100% { transform: translateX(-100%); }
}
.marquee-box {
    /* Hide content that exceeds the container width */
    overflow: hidden;
    white-space: nowrap;
    background: #eee; /* Grey background matching your image */
    flex-grow: 1;
    display: flex; /* Required for stretching content */
    align-items: center;
}
.marquee-content {
    display: inline-block;
    font-family: "Courier New", monospace;
    font-size: 14px;
    /* Padding is kept at 40px for spacing between loops */
    padding: 0 20px;
    /* Apply the infinite loop animation */
    animation: marquee-scroll 18s linear infinite;
}

<script>
// ----------------------------
// Utilities & state
// ----------------------------
function isMobile() { return window.innerWidth < 768; }

let zIndexCounter = 50;
let visitCount = parseInt(localStorage.getItem("visitCount") || "0", 10);
visitCount++; localStorage.setItem("visitCount", visitCount);
let cycleIndex = 1;
let autoCycleInterval;
let userInteracted = false;

// ----------------------------
// Projects data (2-4 items typical)
// ----------------------------
const projects = {
  DrakeCanvas: [
   { type: 'image', src: 'Content/drakegifs/herloss.gif', width: '300px', height: '300px', link: 'portfolio.html#project-1' },
   { type: 'image', src: 'Content/drakegifs/views.gif', width: '300px', height: '300px', link: 'portfolio.html#project-1' },
   { type: 'image', src: 'Content/drakegifs/iceman.gif', width: '300px', height: '300px',link: 'portfolio.html#project-1' },
   { type: 'image', src: 'Content/drakegifs/takecare.gif', width: '300px', height: '300px', link: 'portfolio.html#project-1' },
   { type: 'image', src: 'Content/drakegifs/morelife.gif', width: '300px', height: '300px', link: 'portfolio.html#project-1' }
  ],
  sznX: [
   { type: 'image', src: 'sznxgif1.gif', width: '400px', height: '228px', link: 'portfolio.html#project-2' },
   { type: 'image', src: 'sznxgif2.gif', width: '350px', height: '278px', link: 'portfolio.html#project-2' },
   { type: 'image', src: 'sznxgif3.gif', width: '500px', height: '278px', link: 'portfolio.html#project-2' }
  ],
  yzyApp: [
   { type: 'image', src: 'yzyappgif1.gif', width: '400px', height: '228px', link: 'portfolio.html#project-5' },
   { type: 'image', src: 'yzyappgif2.gif', width: '350px', height: '278px', link: 'portfolio.html#project-5' },
   { type: 'image', src: 'yzyappgif3.gif', width: '500px', height: '278px', link: 'portfolio.html#project-5' }
  ]
};

const displayNames = { DrakeCanvas: 'Drake Canvas', sznX: 'Szn X', yzyApp: 'YZY App' };
const projectItems = document.querySelectorAll('.project-item');
const mediaGrid = document.getElementById('media-grid');
const projectSelector = document.getElementById('project-selector');

// ----------------------------
// Dragging (desktop only)
// ----------------------------
function makeDraggable(element, handle) {
  if (isMobile()) return;
  let offsetX = 0, offsetY = 0;
  handle.addEventListener('mousedown', startDrag);
  function startDrag(e) {
    if (e.target.closest('#profile-controls')) return;
    e.preventDefault();
    if (element.classList.contains('media-container')) stopAutoCycle();
    element.style.zIndex = zIndexCounter++;
    offsetX = e.clientX - element.offsetLeft;
    offsetY = e.clientY - element.offsetTop;
    if (element.id === 'profile-window') element.style.transform = 'none';
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
  }
  function onDrag(e) {
    element.style.left = `${e.clientX - offsetX}px`;
    element.style.top = `${e.clientY - offsetY}px`;
  }
  function stopDrag() {
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
  }
}

// ----------------------------
// Intro / Typewriter
// ----------------------------
const introOverlay = document.getElementById('intro-overlay');
const introWindow = document.getElementById('intro-window');
const introText = document.getElementById('intro-text');
const siteHeader = document.getElementById('site-header');
const siteMain = document.getElementById('site-main');
let introDone = false;

function typeWriter(text, element, speed, callback) {
  let i = 0;
  element.textContent = '';
  function typing() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    } else { callback && callback(); }
  }
  typing();
}

function finishIntro(skip=false) {
  if (introDone) return;
  introDone = true;
  introWindow.classList.add('minimised');
  setTimeout(() => {
    if (!isMobile() && introOverlay) introOverlay.remove();
    siteHeader.classList.remove('opacity-0');
    siteMain.classList.remove('opacity-0');
  }, skip ? 0 : 400);
}

function playIntro() {
  if (isMobile()) return;
  setTimeout(() => {
    introWindow.classList.add('active');
    typeWriter("Welcome to loops.szn", introText, 50, () => {
      setTimeout(() => finishIntro(false), 400);
    });
  }, 100);
}

// ----------------------------
// Media element creation
// ----------------------------
function createMediaElement(item) {
  let element;
  if (item.type === 'image') {
    element = document.createElement('img');
    element.className = 'media-item';
    
    element.dataset.src = item.src;
    element.alt = '';
    element.onerror = function() { this.src = 'https://placehold.co/400x300/FF0000/FFFFFF?text=ERROR'; };
    element.addEventListener('click', e => { e.stopPropagation(); window.location.href = item.link; });
  } else {
    element = document.createElement('video');
    element.className = 'media-item';
    element.autoplay = true; element.loop = true; element.muted = true; element.playsInline = true;
    element.dataset.src = item.src;
    element.addEventListener('click', e => { e.stopPropagation(); window.location.href = item.link; });
  }
  return element;
}

// ----------------------------
// Overlap helper for desktop placement
// ----------------------------
function checkOverlap(rect1, rect2, SPACING = 40) {
  return !(
    rect1.right + SPACING < rect2.left ||
    rect1.left > rect2.right + SPACING ||
    rect1.bottom + SPACING < rect2.top ||
    rect1.top > rect2.bottom + SPACING
  );
}
function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

// ----------------------------
// Generate media (desktop absolute windows; mobile stacked)
// ----------------------------
let activeMediaContainers = [];
function generateMedia(project) {
  if (!projects[project]) return;
  const media = projects[project];

  // Clear existing
  activeMediaContainers.forEach((container, i) => {
    container.classList.remove('active');
    setTimeout(() => container.remove(), 400 + i * 50);
  });
  activeMediaContainers = [];
  zIndexCounter = 50;

  // Mobile: stacked & scrollable
  if (isMobile()) {
  mediaGrid.innerHTML = '';

  media.forEach((item) => {
    const container = document.createElement('div');
    container.className = 'media-container active';
    const titlebar = document.createElement('div');
    titlebar.className = 'media-titlebar';
    titlebar.innerText = (displayNames[project] || project).toUpperCase();

    const content = createMediaElement(item);
    // 🔸 Load immediately — avoids flicker from delayed src setting
    content.src = item.src;

    // 🔸 For videos, ensure smooth autoplay
    if (content.tagName === 'VIDEO') {
      content.preload = 'auto';
      content.autoplay = true;
      content.loop = true;
      content.muted = true;
      content.playsInline = true;
    }

    container.appendChild(titlebar);
    container.appendChild(content);
    mediaGrid.appendChild(container);
    activeMediaContainers.push(container);
  });

  return;
}

  // Desktop: random non-overlapping placement (preserve original behavior)
  const PADDING = 60;
  const desktopNav = document.getElementById('desktop-nav');
  const headerBottom = desktopNav ? desktopNav.getBoundingClientRect().bottom : 0;
  const selectorRect = projectSelector.getBoundingClientRect();
  let placedRects = [];

  media.forEach((item, i) => {
    const container = document.createElement('div');
    container.className = 'media-container';
    container.style.width = item.width;
    container.style.height = item.height;
    const width = parseInt(item.width);
    const height = parseInt(item.height);

    const minX = PADDING;
    const maxX = window.innerWidth - width - PADDING;
    const minY = headerBottom + PADDING;
    const maxY = window.innerHeight - height - PADDING;

    if (maxX <= minX || maxY <= minY) {
      // fallback to centered placement
      container.style.left = `${(window.innerWidth - width) / 2}px`;
      container.style.top = `${(window.innerHeight - height) / 2}px`;
    } else {
      let finalLeft = 0, finalTop = 0, placed = false, attempts = 0, maxAttempts = 100;
      while (!placed && attempts < maxAttempts) {
        attempts++;
        let left = Math.random() * (maxX - minX) + minX;
        let top = Math.random() * (maxY - minY) + minY;

        // selector collision check
        const SPACING_BUFFER = 20;
        let selectorCollision = (
          left < selectorRect.right + SPACING_BUFFER &&
          left + width > selectorRect.left - SPACING_BUFFER &&
          top < selectorRect.bottom + SPACING_BUFFER &&
          top + height > selectorRect.top - SPACING_BUFFER
        );
        if (selectorCollision) continue;

        const currentRect = { left: left, top: top, right: left + width, bottom: top + height };
        let mediaOverlap = false;
        for (const rect of placedRects) {
          if (checkOverlap(currentRect, rect, 40)) { mediaOverlap = true; break; }
        }
        if (!mediaOverlap) {
          finalLeft = left; finalTop = top; placed = true; placedRects.push(currentRect);
        }
      }
      if (!placed) {
        finalLeft = Math.random() * (maxX - minX) + minX;
        finalTop = Math.random() * (maxY - minY) + minY;
      }
      const finalClampedLeft = clamp(finalLeft, minX, maxX);
      const finalClampedTop = clamp(finalTop, minY, maxY);
      container.style.left = `${finalClampedLeft}px`;
      container.style.top = `${finalClampedTop}px`;
    }

    const titlebar = document.createElement('div');
    titlebar.className = 'media-titlebar';
    titlebar.innerText = (displayNames[project] || project).toUpperCase();
    container.appendChild(titlebar);
    const content = createMediaElement(item);
    container.appendChild(content);
    content.src = content.dataset.src;

    makeDraggable(container, titlebar);
    mediaGrid.appendChild(container);
    activeMediaContainers.push(container);
    setTimeout(() => container.classList.add('active'), 100 + i * 80);
  });
}

// ----------------------------
// Auto-cycle 
// ----------------------------
const projectKeys = Object.keys(projects);

function startAutoCycle() {
  // Only run auto-cycle on desktop
  if (isMobile()) return;
  autoCycleInterval = setInterval(() => {
    if (!userInteracted) {
      const project = projectKeys[cycleIndex % projectKeys.length];
      generateMedia(project);
      projectItems.forEach(i => i.classList.remove('font-bold'));
      const activeItem = document.querySelector(`.project-item[data-project="${project}"]`);
      if (activeItem) activeItem.classList.add('font-bold');
      cycleIndex++;
    }
  }, 3000);
}

// Start it only if not mobile
if (!isMobile()) startAutoCycle();

function stopAutoCycle() {
  if (!userInteracted) {
    clearInterval(autoCycleInterval);
    userInteracted = true;
  }
}

// ----------------------------
// Project click handlers
// ----------------------------
projectItems.forEach(item => {
  // Only add click listener to project items with data-project
  if (item.dataset.project) {
    item.addEventListener('click', () => {
      const project = item.dataset.project;
      if (isMobile()) {
        // scroll media-grid to top on mobile when switching projects
        generateMedia(project);
        document.querySelectorAll('.project-item').forEach(i => i.classList.remove('font-bold'));
        item.classList.add('font-bold');
        const grid = document.getElementById('media-grid');
        if (grid) grid.scrollTop = 0;
        stopAutoCycle();
        return;
      }
      stopAutoCycle();
      generateMedia(project);
      projectItems.forEach(i => i.classList.remove('font-bold'));
      item.classList.add('font-bold');
    });
  }
});

// ----------------------------
// Profile window (centered on mobile)
// ----------------------------

const mobileProfileButton = document.getElementById('mobile-profile-btn');
let profileWindow = null;

    if (profileWindow) return;
  } else {
    if (profileWindow) {
      profileWindow.style.zIndex = zIndexCounter++;
      return;
    }
  }

  profileWindow = document.createElement('div');
  profileWindow.id = 'profile-window';
  profileWindow.style.zIndex = zIndexCounter++;

  const titlebar = document.createElement('div');
  titlebar.id = 'profile-titlebar';
  titlebar.innerHTML = `
    <span>PROFILE</span>
    <div id="profile-controls">
      <button id="profile-minimise">–</button>
      <button id="profile-close">×</button>

  `;

  const content = document.createElement('div');
  content.id = 'profile-content';
  content.innerHTML = `

      <img src="portrait.jpg" alt="Portrait">
      <div class="space-y-1 text-sm">
        <a href="https://behance.net/loopsye" target="_blank" class="block text-blue-700 hover:underline">// BEHANCE</a>
        <a href="https://instagram.com/loops.szn" target="_blank" class="block text-blue-700 hover:underline">// INSTAGRAM</a>
        <a href="blog.html" target="_blank" class="block text-blue-700 hover:underline">// BLOG</a>
      </div>
    </div>
    <div id="profile-description">
      <h2 class="text-lg font-bold mb-2">Loops.szn</h2>
      <p>Loops is a creative video editor and designer who worked with brands like
       <a href="https://en.wikipedia.org/wiki/Yeezy_(brand)#Yeezy_App" target="_blank" class="text-blue-700 hover:underline">YZY</a>,
       <a href="https://www.cena2k.com/" target="_blank" class="text-blue-700 hover:underline">CENA2K</a>, 
       <a href="https://www.youtube.com/watch?v=IHnOskzT8Sg" target="_blank" class="text-blue-700 hover:underline">CODEFORTY</a>, 
       and did work for artists like 
       <a href="https://www.youtube.com/watch?v=IHnOskzT8Sg" target="_blank" class="text-blue-700 hover:underline">R2R Moe</a>,
       and 
       <a href="https://www.instagram.com/p/DQdml9kiGej/" target="_blank" class="text-blue-700 hover:underline">KayCyy</a>,

  `;

  profileWindow.appendChild(titlebar);
  profileWindow.appendChild(content);
  document.body.appendChild(profileWindow);

  // Initial placement (Overwritten by CSS on mobile, but needed for desktop)
  if (!isMobile()) {
    const { innerWidth, innerHeight } = window;
    profileWindow.style.left = `${(innerWidth - profileWindow.offsetWidth) / 2}px`;
    profileWindow.style.top = `${(innerHeight - profileWindow.offsetHeight) / 2}px`;
  }

  makeDraggable(profileWindow, titlebar);

  const minimiseBtn = profileWindow.querySelector('#profile-minimise');
  minimiseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    content.classList.toggle('hidden');
    minimiseBtn.textContent = content.classList.contains('hidden') ? '+' : '–';
  });

  const closeBtn = profileWindow.querySelector('#profile-close');
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    profileWindow.classList.remove('active');
    setTimeout(() => {
      profileWindow.remove();
      profileWindow = null;
      document.body.classList.remove('mobile-lock');
    }, 200);
  });

  setTimeout(() => profileWindow.classList.add('active'), 50);
}

profileButton && profileButton.addEventListener('click', createProfileWindow);
mobileProfileButton && mobileProfileButton.addEventListener('click', () => {
  createProfileWindow();
});

// ----------------------------
// Parallax (desktop only)
// ----------------------------
const grid = document.getElementById('parallax-grid');
if (!isMobile() && !('ontouchstart' in window)) {
  document.addEventListener('mousemove', e => {
    const { innerWidth, innerHeight } = window;
    const x = (e.clientX / innerWidth - 0.5) * 20;
    const y = (e.clientY / innerHeight - 0.5) * 20;
    grid.style.transform = `translate(${x}px, ${y}px)`;
  });
} else {
  grid.style.display = 'none';
}


// ----------------------------
// Initial page load
// ----------------------------
window.addEventListener('load', () => {
  if (isMobile()) {
    if(introOverlay) introOverlay.style.display = 'none';
  }
  if (visitCount === 1 || visitCount % 3 === 0) {
    playIntro();
  } else {
    finishIntro(true);
  }
  // initial project
  generateMedia('DrakeCanvas'); 
  const initialActiveProject = 
 document.querySelector('.project-item[data-project="Drake Canvas"]');
  if (initialActiveProject) 
 initialActiveProject.classList.add('font-bold');

  if (isMobile()) {
    stopAutoCycle(); 
  }

  cycleIndex = 1;
});

// Accessibility: resize handling to re-render for mobile/desktop mode changes
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // regenerate current project to switch between desktop/mobile layout placement
    const activeItem = document.querySelector('.project-item.font-bold');
    const project = activeItem ? activeItem.dataset.project : 'sznX';
    generateMedia(project);

    // reposition profile modal on breakpoint change to avoid weird offsets
    if (profileWindow) {
      if (!isMobile()) {
        // reposition center for desktop
        const { innerWidth, innerHeight } = window;
        profileWindow.style.left = `${(innerWidth - profileWindow.offsetWidth) / 2}px`;
        profileWindow.style.top = `${(innerHeight - profileWindow.offsetHeight) / 2}px`;
        profileWindow.style.transform = 'scale(1)';
      } else {
        // ensure mobile centering classes are applied on mobile resize
        profileWindow.style.left = '50%';
        profileWindow.style.top = '50%';
        profileWindow.style.transform = 'translate(-50%, -50%)';
      }
    }
  }, 180);
});

// Prevent accidental long-press drag on mobile images
document.addEventListener('touchstart', function(){}, {passive:true});

</script>
